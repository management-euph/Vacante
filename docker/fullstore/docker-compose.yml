# Local full-store CS-Cart sandbox for addon testing.
#
#   cp .env.example .env         # then fill CSCART_LICENSE_KEY
#   (drop cscart_v4.21.2.zip into ./kit/)
#   docker compose up -d --build
#
# Store       http://localhost:8080   (admin at /admin.php)
# Mailpit     http://localhost:8025   (catches every outbound email)
# phpMyAdmin  http://localhost:8081
#
# Reset clean:  docker compose down -v   (drops the docroot + db volumes)
name: novotonbun-fullstore

services:
  app:
    build:
      context: .
    image: novotonbun-fullstore-app:latest
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CSCART_DB_HOST: db
      CSCART_DB_NAME: "${CSCART_DB_NAME:-cscart}"
      CSCART_DB_USER: "${CSCART_DB_USER:-cscart}"
      CSCART_DB_PASSWORD: "${CSCART_DB_PASSWORD:-cscart}"
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # CS-Cart docroot lives in a named volume (fast on Windows; never
      # bind-mount the whole store). The repo is mounted read-WRITE: the
      # addons are symlinked into design/ and var/langs/, and CS-Cart's
      # installer hard-requires those trees to be writable (is_writable()).
      # A :ro mount fails that check and blocks the install. CS-Cart writes
      # its runtime data into the var/ volume, not the addon source, so the
      # working tree stays clean in practice. The kit folder feeds the
      # one-time install.
      - docroot:/var/www/html
      - ../..:/repo
      - ./kit:/kit:ro
      # Standalone provider-API dev probes served as REAL files in the web root
      # (http://localhost:8080/dev/…) — dev/novoton, dev/sphinx and the
      # dev/sphinx_api_dev sandbox. Mounted straight into the docroot so
      # `docker compose up -d` recreates the container and picks it up — no image
      # rebuild, no symlink. Host edits reflect live. Local sandbox only.
      - ../../dev:/var/www/html/dev
    restart: unless-stopped

  db:
    # MariaDB 10.11 to match the production server (10.11.14). Pin :10.11.14
    # for a byte-exact match — the 10.11 series is behaviourally identical.
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: "${CSCART_DB_NAME:-cscart}"
      MARIADB_USER: "${CSCART_DB_USER:-cscart}"
      MARIADB_PASSWORD: "${CSCART_DB_PASSWORD:-cscart}"
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      # MariaDB's own healthcheck helper (avoids the deprecated mysql-named tools).
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: "${CSCART_DB_USER:-cscart}"
      PMA_PASSWORD: "${CSCART_DB_PASSWORD:-cscart}"
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  docroot:
  dbdata:
