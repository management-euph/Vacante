name: Static Analysis & Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── PHPStan (level 10 — zero errors outside baseline) ──
  phpstan:
    name: PHPStan (L10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install root dev dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # ── Baseline ratchet: phpstan-baseline.neon may only shrink ──
      # New code must be level-10 clean. Fail the PR if the total number of
      # baselined errors grew vs the base branch — forces fixing, not suppressing.
      # ONE exception: when the PR also changes phpstan.neon (an analysis-
      # COVERAGE expansion — e.g. 2026-07 brought the addon-root func.php/
      # init.php files under analysis, absorbing their pre-existing debt),
      # growth is downgraded to a loud warning for the reviewer instead of a
      # failure. PRs that don't touch phpstan.neon keep the hard gate.
      - name: PHPStan baseline ratchet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 --quiet origin "${{ github.base_ref }}"
          base=$(git show "origin/${{ github.base_ref }}:phpstan-baseline.neon" 2>/dev/null | grep -oE 'count: [0-9]+' | awk '{s+=$2} END {print s+0}')
          cur=$(grep -oE 'count: [0-9]+' phpstan-baseline.neon | awk '{s+=$2} END {print s+0}')
          echo "phpstan-baseline.neon total errors — base=$base, PR=$cur"
          if [ "$cur" -gt "$base" ]; then
            if ! git diff --quiet "origin/${{ github.base_ref }}" -- phpstan.neon; then
              echo "::warning::PHPStan baseline grew ($base -> $cur) alongside a phpstan.neon change — treating as an analysis-coverage expansion. Reviewer: confirm the new baseline entries belong ONLY to newly-covered paths."
            else
              echo "::error::PHPStan baseline grew ($base -> $cur). New code must be level-10 clean — fix the errors instead of adding baseline entries."
              exit 1
            fi
          else
            echo "OK: baseline did not grow."
          fi

  # ── PHP CS Fixer (dry-run; fails if formatting would change) ──
  phpcsfixer:
    name: PHP CS Fixer (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install root dev dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      # Conservative pass (imports + whitespace only) over the procedural
      # CS-Cart files the main config deliberately skips — controllers/,
      # functions/, hooks/, addon-root func.php/init.php (audit M6).
      - name: Run PHP CS Fixer (procedural files)
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.procedural.php --dry-run --diff --using-cache=no

  # ── Rector (dry-run; fails if any configured rule would change a file) ──
  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install root dev dependencies
        run: composer install --no-progress --no-interaction

      - name: Run Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

  # ── PHPUnit (novoton suite, with coverage) ──
  phpunit:
    name: PHPUnit (novoton)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon-novoton-holidays/app/addons/novoton_holidays
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Install addon dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --colors=always --coverage-text=coverage.txt --coverage-clover=coverage.xml

      # ── Coverage floor: line coverage may not drop below the floor ──
      # Floor = measured coverage minus a small margin (novoton measured
      # 22.69%, sphinx 28.13%, travel_core 34.00% on 2026-07-24)
      # minus a small margin. Raise the floor as coverage grows — never lower
      # it to make a PR pass; write the missing tests instead.
      - name: Enforce coverage floor
        run: |
          floor=21.5
          pct=$(python3 -c "
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage.xml').getroot().find('./project/metrics')
          total = int(m.get('statements')); covered = int(m.get('coveredstatements'))
          print(f'{covered / total * 100:.2f}' if total else '0.00')
          ")
          echo "novoton line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p+0 < f+0) }' && {
            echo "::error::Line coverage ${pct}% fell below the ${floor}% floor — add tests for the code this PR touches."
            exit 1
          }
          echo "OK: coverage >= floor."

      - name: Append coverage summary to job summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            {
              echo '## Coverage summary'
              echo ''
              echo '```'
              # Trim ANSI + print from "Code Coverage Report" onward
              awk '/Code Coverage Report/,0' coverage.txt | sed 's/\x1b\[[0-9;]*m//g' | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            addon-novoton-holidays/app/addons/novoton_holidays/coverage.txt
            addon-novoton-holidays/app/addons/novoton_holidays/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # ── PHPUnit integration (novoton) — real MySQL via the pre-baked test-DB image ──
  #
  # Unit tests (above) run with no service container, proving they are DB-free.
  # This job wires up the ghcr.io/puboop2018/novotonbun-test-db image as a
  # service container and runs the Integration testsuite against it. Each
  # test is wrapped in a DB transaction that is rolled back on tearDown.
  #
  # Gating: this job only runs when the repository variable
  # INTEGRATION_TESTDB_READY is set to "true". That variable should be
  # flipped on (Settings → Secrets and variables → Actions → Variables)
  # AFTER the maintainer has:
  #   1. Run docker/test-db/build.sh locally with CSCART_ZIP_PATH +
  #      CSCART_LICENSE_KEY set.
  #   2. Pushed the resulting image to ghcr.io/puboop2018/novotonbun-test-db.
  #   3. Added secrets.GHCR_READ_TOKEN (a PAT with read:packages scope).
  # Until then the job is skipped — its absence does not block merges.
  #
  # See docker/test-db/README.md for how the image is built. The tag here
  # must match what docker-compose.test.yml pins.
  phpunit-integration-novoton:
    name: PHPUnit Integration (novoton)
    runs-on: ubuntu-latest
    if: vars.INTEGRATION_TESTDB_READY == 'true'
    defaults:
      run:
        working-directory: addon-novoton-holidays/app/addons/novoton_holidays
    services:
      db:
        image: ghcr.io/puboop2018/novotonbun-test-db:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: cscart
          MYSQL_USER: cscart
          MYSQL_PASSWORD: cscart
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, curl, mbstring, pdo, pdo_mysql
          tools: composer:v2

      - name: Install addon dependencies
        run: composer install --no-progress --no-interaction

      - name: Wait for MySQL healthcheck
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MySQL did not become healthy"; exit 1

      - name: Run PHPUnit (integration)
        env:
          DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=cscart'
          DB_USER: cscart
          DB_PASS: cscart
        run: vendor/bin/phpunit -c phpunit-integration.xml --colors=always --no-coverage

  # ── PHPUnit (travel_core suite) ──
  phpunit-travel-core:
    name: PHPUnit (travel_core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon-travel-core/app/addons/travel_core
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Install addon dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --colors=always --coverage-text=coverage.txt --coverage-clover=coverage.xml

      # ── Coverage floor (same ratchet as novoton's): travel_core is the
      # shared kernel — a regression here hits BOTH storefronts, so it gets
      # a floor too. Floor = measured coverage at introduction (30.36% on
      # 2026-07-22) minus a small margin. Raise the floor as coverage grows —
      # never lower it to make a PR pass; write the missing tests instead.
      - name: Enforce coverage floor
        run: |
          floor=33.0
          pct=$(python3 -c "
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage.xml').getroot().find('./project/metrics')
          total = int(m.get('statements')); covered = int(m.get('coveredstatements'))
          print(f'{covered / total * 100:.2f}' if total else '0.00')
          ")
          echo "travel_core line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p+0 < f+0) }' && {
            echo "::error::Line coverage ${pct}% fell below the ${floor}% floor — add tests for the code this PR touches."
            exit 1
          }
          echo "OK: coverage >= floor."

  # ── PHPUnit (sphinx_holidays suite) ──
  phpunit-sphinx:
    name: PHPUnit (sphinx_holidays)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon-sphinx-holidays/app/addons/sphinx_holidays
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Install addon dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --colors=always --coverage-text=coverage.txt --coverage-clover=coverage.xml

      # ── Coverage floor (same ratchet as novoton's). Floor = measured
      # coverage at introduction (28.71% on 2026-07-22) minus a small margin.
      # Raise the floor as coverage grows — never lower it to make a PR pass;
      # write the missing tests instead.
      - name: Enforce coverage floor
        run: |
          floor=27.5
          pct=$(python3 -c "
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage.xml').getroot().find('./project/metrics')
          total = int(m.get('statements')); covered = int(m.get('coveredstatements'))
          print(f'{covered / total * 100:.2f}' if total else '0.00')
          ")
          echo "sphinx_holidays line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p+0 < f+0) }' && {
            echo "::error::Line coverage ${pct}% fell below the ${floor}% floor — add tests for the code this PR touches."
            exit 1
          }
          echo "OK: coverage >= floor."

  # ── PHPUnit (fgo_invoicing suite) ──
  phpunit-fgo:
    name: PHPUnit (fgo_invoicing)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon-fgo-invoicing/app/addons/fgo_invoicing
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Install addon dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --colors=always --coverage-text=coverage.txt --coverage-clover=coverage.xml

      # ── Coverage floor (same ratchet as the other suites). Floor =
      # measured coverage minus a small margin. Raise the floor as coverage
      # grows — never lower it to make a PR pass; write the missing tests
      # instead.
      #   2026-07-22: introduced at 52.53% measured, floor 51.0.
      #   2026-09-19: the floor went red at 49.67% — LanguageSeeder,
      #     TypeCoerce and ConfigProvider had shipped with no tests of their
      #     own. Unit tests added for all three; measured 63.59%, floor 62.0.
      - name: Enforce coverage floor
        run: |
          floor=62.0
          pct=$(python3 -c "
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage.xml').getroot().find('./project/metrics')
          total = int(m.get('statements')); covered = int(m.get('coveredstatements'))
          print(f'{covered / total * 100:.2f}' if total else '0.00')
          ")
          echo "fgo_invoicing line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p+0 < f+0) }' && {
            echo "::error::Line coverage ${pct}% fell below the ${floor}% floor — add tests for the code this PR touches."
            exit 1
          }
          echo "OK: coverage >= floor."

  # ── PHPUnit (eurosite suite) ──
  phpunit-eurosite:
    name: PHPUnit (eurosite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addon-eurosite/app/addons/eurosite
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Install addon dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --colors=always --coverage-text=coverage.txt --coverage-clover=coverage.xml

      # ── Coverage floor (same ratchet as the other suites). Floor =
      # measured coverage at introduction (34.56% on 2026-08-06) minus a
      # small margin. Raise the floor as coverage grows — never lower it to
      # make a PR pass; write the missing tests instead.
      - name: Enforce coverage floor
        run: |
          floor=33.0
          pct=$(python3 -c "
          import xml.etree.ElementTree as ET
          m = ET.parse('coverage.xml').getroot().find('./project/metrics')
          total = int(m.get('statements')); covered = int(m.get('coveredstatements'))
          print(f'{covered / total * 100:.2f}' if total else '0.00')
          ")
          echo "eurosite line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p+0 < f+0) }' && {
            echo "::error::Line coverage ${pct}% fell below the ${floor}% floor — add tests for the code this PR touches."
            exit 1
          }
          echo "OK: coverage >= floor."

  # ── php -l syntax check on all PHP files ──
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint all PHP files
        # Whole addon trees (controllers, functions, hooks, schemas, root
        # func.php/init.php, src, tests) — not just src/ (audit M6).
        run: |
          find addon-novoton-holidays/app/addons/novoton_holidays \
               addon-travel-core/app/addons/travel_core \
               addon-sphinx-holidays/app/addons/sphinx_holidays \
               addon-fgo-invoicing/app/addons/fgo_invoicing \
               addon-eurosite/app/addons/eurosite \
               -path '*/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n 50 php -l

  # ── ESLint + Vitest (frontend JS / JSX) ──
  # Lints the addons' standalone JS (addon-*/js) and the React booking-engine
  # source (addon-*/react-src/src). JS embedded in Smarty .tpl templates is out
  # of scope (ESLint can't parse Smarty) — Qodana covers that.
  # Vitest (jsdom) runs the behavioral suites in tests/js over the shared
  # booking modules (DOB validation/masking, price display, multi-room
  # selection) — revenue-path browser code that had no tests before.
  eslint:
    name: ESLint (JS/JSX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run JS behavioral tests (Vitest)
        run: npm test

  # ── Qodana (JetBrains static analysis) ──
  # THE single Qodana entry point for this repo. A second, ungated workflow
  # (.github/workflows/qodana_code_quality.yml) was added by the Qodana Cloud
  # setup automation in #1 and removed again on 2026-09-19: it duplicated every
  # scan, bypassed the `needs` gate below, and pointed at a different cloud
  # project token. The token below prefers the newer project and falls back to
  # the original one, so whichever secret the repo actually holds is used.
  # Gated behind the rest of the gauntlet via `needs`, so Qodana runs only
  # AFTER PHPStan / php-cs-fixer / Rector / PHPUnit / Lint / ESLint have all
  # passed — it is the final quality gate, not a parallel one. (If any of those
  # fail, this job is skipped.) The optional, usually-skipped integration job is
  # intentionally not a dependency, so its skip can't propagate here.
  qodana:
    name: Qodana
    needs:
      - phpstan
      - phpcsfixer
      - rector
      - phpunit
      - phpunit-travel-core
      - phpunit-sphinx
      - phpunit-fgo
      - phpunit-eurosite
      - lint
      - eslint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # actual PR commit on PRs; empty on push → defaults to the pushed commit
          fetch-depth: 0                                   # full history required for Qodana PR analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          upload-result: true   # publish qodana.sarif.json as a build artifact for offline triage
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_28473803 || secrets.QODANA_TOKEN_1757207161 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
