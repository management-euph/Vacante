name: Deploy SSH
description: >
  SSH client set up for the deploy workflows. The server is reachable as the
  alias "store" (ssh store, rsync store:/path), so no step ever needs to name
  the host or the user: the repository is public, and so are its logs.

inputs:
  ssh-key:
    description: Private key of the deploy user (secret ARTIFACT_SSH_KEY)
    required: true
  host:
    description: Server host name or IP (secret ARTIFACT_HOST)
    required: true
  user:
    description: User to log in as (secret ARTIFACT_USERNAME)
    required: true
  port:
    description: SSH port (variable DEPLOY_PORT; 22 when empty)
    required: false
    default: ''
  known-hosts:
    description: >
      The server's host key line(s) from `ssh-keyscan -p PORT host` (secret
      DEPLOY_KNOWN_HOSTS). Pins the server. When empty the key is fetched on
      each run and trusted (what the Hetzner tutorial does), and its
      fingerprint is shown in the run summary.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        SSH_PORT: ${{ inputs.port }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$*"; { echo "## SSH setup failed"; echo "$*"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
        if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
          fail "Secrets ARTIFACT_SSH_KEY, ARTIFACT_HOST and ARTIFACT_USERNAME must be set (docs/DEPLOY.md, step 3)."
        fi
        # A pasted secret often carries a space or a line break.
        host=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
        user=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
        port=$(printf '%s' "${SSH_PORT:-22}" | tr -d '[:space:]')
        case "$host" in
          *@*) fail "ARTIFACT_HOST must be only the server's name or IP address: the user goes in ARTIFACT_USERNAME." ;;
          */*) fail "ARTIFACT_HOST must be only the server's name or IP address, without https:// or a path." ;;
        esac
        if [[ "$host" =~ ^[^:]+:[0-9]+$ ]]; then
          fail "ARTIFACT_HOST must not include the port: set the port as the environment variable DEPLOY_PORT."
        fi
        [[ "$host" =~ ^[A-Za-z0-9.:-]+$ ]] || fail "ARTIFACT_HOST has unexpected characters: it must be only the server's name or IP address."
        [[ "$user" =~ ^[A-Za-z0-9._-]+$ ]] || fail "ARTIFACT_USERNAME must be only the user name (no @, no host)."
        [[ "$port" =~ ^[0-9]+$ ]] || fail "DEPLOY_PORT must be a number."

        install -d -m 700 ~/.ssh
        # A key copied on Windows may carry CR line endings: OpenSSH rejects them.
        printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if grep -q '^PuTTY-User-Key-File' ~/.ssh/deploy_key; then
          fail "ARTIFACT_SSH_KEY is a PuTTY key (.ppk): GitHub needs an OpenSSH key, starting with -----BEGIN OPENSSH PRIVATE KEY-----. Create one without a passphrase (docs/DEPLOY.md, step 2)."
        fi
        if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
          probe=$(ssh-keygen -y -P 'x' -f ~/.ssh/deploy_key 2>&1 || true)
          if grep -q 'ENCRYPTED' ~/.ssh/deploy_key || [[ "$probe" == *passphrase* ]]; then
            fail "ARTIFACT_SSH_KEY has a passphrase, which GitHub cannot type: use a key made for GitHub without one (docs/DEPLOY.md, step 2)."
          fi
          fail "ARTIFACT_SSH_KEY is not a usable private key: paste the whole private key file (not the .pub), from -----BEGIN to -----END."
        fi
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        else
          banner=$(ssh-keyscan -T 15 -p "$port" -t ed25519,ecdsa,rsa "$host" 2>&1 > ~/.ssh/known_hosts || true)
          # Hetzner managed servers (konsoleH) answer on 22 with an
          # SFTP-only service (ProFTPD mod_sftp): no shell, so no rsync.
          if [[ "$banner" == *mod_sftp* ]]; then
            fail "Port $port is an SFTP-only service (mod_sftp): it gives no shell, so rsync cannot run there. On a Hetzner managed server (konsoleH), SSH is on port 222: set the environment variable DEPLOY_PORT to 222."
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            # Why: the name, the port, or something in between. The host is a
            # secret; nothing below prints it.
            if ! getent ahosts "$host" >/dev/null; then
              why="ARTIFACT_HOST does not resolve to an address: check it is the server's name or IP address, spelled right."
            else
              rc=0
              # Host and port go in as arguments, never into the code itself.
              # shellcheck disable=SC2016
              timeout 15 bash -c 'exec 3<>"/dev/tcp/$1/$2"' _ "$host" "$port" 2>/dev/null || rc=$?
              if [ "$rc" -eq 124 ]; then
                why="Port $port does not answer from GitHub (the connection times out): a firewall drops it (Hetzner Cloud Firewall, ufw, CSF...) or SSH listens on another port. Allow SSH on that port from any address (key login only), or set the right port as DEPLOY_PORT."
              elif [ "$rc" -ne 0 ]; then
                why="Port $port refuses connections: SSH is not listening there. Find the SSH port (Port in /etc/ssh/sshd_config, or the panel) and set it as the environment variable DEPLOY_PORT."
              else
                why="Port $port answers, but not like an SSH server: is it the SSH port? Set the right one as DEPLOY_PORT."
              fi
            fi
            fail "Could not read the server's SSH host key. $why"
          fi
          {
            echo "### Server host key (not pinned)"
            echo "Trusted on first use. To pin it, save the output of \`ssh-keyscan -p $port <host>\` as the secret DEPLOY_KNOWN_HOSTS."
            echo '```'
            ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $1, $2, $NF}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        {
          echo "Host store"
          echo "  HostName $host"
          echo "  User $user"
          echo "  Port $port"
          echo "  IdentityFile ~/.ssh/deploy_key"
          echo "  IdentitiesOnly yes"
          echo "  StrictHostKeyChecking yes"
          echo "  BatchMode yes"
          echo "  ConnectTimeout 20"
          echo "  ServerAliveInterval 15"
          echo "  LogLevel ERROR"
        } > ~/.ssh/config
        chmod 600 ~/.ssh/config
